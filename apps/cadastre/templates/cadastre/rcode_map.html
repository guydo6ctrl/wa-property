<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>R-code zones — Perth metro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(255,255,255,0.92); padding: 8px 12px; border-radius: 6px;
      font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    #panel h1 { font-size: 14px; margin: 0 0 4px 0; }
    .legend { display: grid; grid-template-columns: 16px auto; gap: 4px 8px; margin-top: 6px; }
    .swatch { width: 14px; height: 14px; border: 1px solid #444; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>R-code zones (Perth metro)</h1>
    <div id="summary"><small>loading…</small></div>
    <div class="legend" id="legend"></div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([-31.95, 115.87], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    // Density colour ramp: light yellow (low density) → red (high density).
    const codeColour = (code) => {
      // Parse the base number from codes like "R20", "R20/R40", "R12.5".
      const m = (code || '').match(/R([0-9.]+)/);
      const n = m ? parseFloat(m[1]) : 0;
      if (n < 5)    return '#ffffd9';
      if (n < 15)   return '#edf8b1';
      if (n < 25)   return '#c7e9b4';
      if (n < 35)   return '#7fcdbb';
      if (n < 55)   return '#41b6c4';
      if (n < 85)   return '#1d91c0';
      if (n < 150)  return '#225ea8';
      return '#0c2c84';
    };

    const legendDefs = [
      ['R5–R12.5', '#edf8b1'],
      ['R15–R20', '#c7e9b4'],
      ['R25–R30', '#7fcdbb'],
      ['R35–R50', '#41b6c4'],
      ['R60–R80', '#1d91c0'],
      ['R100–R160', '#225ea8'],
      ['R200+', '#0c2c84'],
    ];
    document.getElementById('legend').innerHTML = legendDefs.map(([label, col]) =>
      `<div class="swatch" style="background:${col}"></div><div>${label}</div>`
    ).join('');

    fetch('/rcodes.geojson')
      .then(r => r.json())
      .then(fc => {
        const layer = L.geoJSON(fc, {
          style: (f) => ({
            color: '#333',
            weight: 0.3,
            fillColor: codeColour(f.properties.code),
            fillOpacity: 0.55,
          }),
          onEachFeature: (f, l) => {
            l.bindPopup(`<b>${f.properties.code}</b><br><small>${f.properties.scheme}</small>`);
            l.bindTooltip(f.properties.code, { sticky: true });
          },
        }).addTo(map);
        if (fc.features.length > 0) map.fitBounds(layer.getBounds(), { padding: [20, 20] });
        document.getElementById('summary').innerHTML =
          `<b>${fc.features.length.toLocaleString()}</b> R-code polygons rendered`;
      })
      .catch(e => {
        document.getElementById('summary').textContent = 'Error: ' + e;
      });
  </script>
</body>
</html>
