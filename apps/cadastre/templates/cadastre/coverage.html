<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cadastre coverage</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(255,255,255,0.92); padding: 8px 12px; border-radius: 6px;
      font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      max-width: 260px;
    }
    #panel h1 { font-size: 14px; margin: 0 0 4px 0; }
    #panel small { color: #555; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Cadastre coverage</h1>
    <div id="summary"><small>loading…</small></div>
    <small>Reload to refresh as the import progresses.</small>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([-31.95, 115.87], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    fetch('/coverage.geojson')
      .then(r => r.json())
      .then(fc => {
        const layer = L.geoJSON(fc, {
          style: { color: '#1e6fdf', weight: 1.5, fillOpacity: 0.18 },
          onEachFeature: (f, l) => {
            const p = f.properties;
            l.bindPopup(`<b>${p.suburb}</b><br>${p.lot_count.toLocaleString()} lots<br>avg ${p.avg_area_sqm}m²`);
            l.bindTooltip(p.suburb, { sticky: true });
          },
        }).addTo(map);
        if (fc.features.length > 0) {
          map.fitBounds(layer.getBounds(), { padding: [20, 20] });
        }
        const totalLots = fc.features.reduce((a, f) => a + f.properties.lot_count, 0);
        document.getElementById('summary').innerHTML =
          `<b>${fc.features.length}</b> suburbs · <b>${totalLots.toLocaleString()}</b> lots imported`;
      })
      .catch(e => {
        document.getElementById('summary').textContent = 'Error loading coverage: ' + e;
      });
  </script>
</body>
</html>
